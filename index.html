<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Policy Perfect Insurance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f3f3f3;
padding:20px;
color:#111;
}

.main{
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
margin-bottom:20px;
}

h1{
font-size:32px;
margin-bottom:25px;
text-align:center;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
font-size:16px;
}

input,select{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#f1f1f1;
font-size:17px;
}

.radio-box{
background:#f8f8f8;
padding:18px;
border-radius:18px;
margin-top:18px;
}

.radio-title{
font-size:17px;
font-weight:bold;
margin-bottom:14px;
}

.radio-group{
display:flex;
gap:35px;
}

.radio-group label{
display:flex;
align-items:center;
gap:10px;
font-size:18px;
}

.radio-group input{
width:24px;
height:24px;
accent-color:black;
}

button{
width:100%;
padding:18px;
margin-top:25px;
border:none;
border-radius:18px;
background:black;
color:white;
font-size:20px;
font-weight:bold;
}

.result{
background:black;
color:white;
padding:25px;
border-radius:22px;
margin-top:25px;
}

.result p{
margin-top:12px;
font-size:17px;
}

.price{
font-size:38px;
font-weight:bold;
margin-top:20px;
}

</style>

</head>

<body>

<div class="main">

<div class="card">

<h1>Commercial Vehicle</h1>

<label>IDV</label>
<input type="number" id="idv" placeholder="Enter IDV">

<label>OD Premium</label>
<input type="number" id="od" placeholder="Enter OD Premium">

<label>TP Premium</label>
<input type="number" id="tp" placeholder="Enter TP Premium">

<label>Discount %</label>
<input type="number" id="discount" placeholder="Enter Discount">

<div class="radio-box">

<div class="radio-title">
IMT 23
</div>

<div class="radio-group">

<label>
<input type="radio" name="imt23" value="yes">
Yes
</label>

<label>
<input type="radio" name="imt23" value="no" checked>
No
</label>

</div>

</div>

<div class="radio-box">

<div class="radio-title">
Restrict TPPD
</div>

<div class="radio-group">

<label>
<input type="radio" name="tppd" value="yes">
Yes
</label>

<label>
<input type="radio" name="tppd" value="no" checked>
No
</label>

</div>

</div>

<button onclick="calculatePremium()">
CALCULATE PREMIUM
</button>

<div id="result"></div>

</div>

</div>

<script>

function calculatePremium(){

let od =
parseFloat(document.getElementById("od").value) || 0;

let tp =
parseFloat(document.getElementById("tp").value) || 0;

let discount =
parseFloat(document.getElementById("discount").value) || 0;

let discountAmount =
(od * discount)/100;

let finalOD =
od - discountAmount;

let imt23 =
document.querySelector('input[name="imt23"]:checked').value;

let tppd =
document.querySelector('input[name="tppd"]:checked').value;

let imt23Charge = 0;

if(imt23 == "yes"){

imt23Charge = finalOD * 0.15;

}

let tppdDiscount = 0;

if(tppd == "yes"){

tppdDiscount = 150;

}

let netPremium =
finalOD +
tp +
imt23Charge -
tppdDiscount;

let gst =
netPremium * 0.18;

let finalPremium =
netPremium + gst;

document.getElementById("result").innerHTML = `

<div class="result">

<p>OD Premium : ₹${od}</p>

<p>Discount : ₹${discountAmount.toFixed(0)}</p>

<p>Final OD : ₹${finalOD.toFixed(0)}</p>

<p>TP Premium : ₹${tp}</p>

<p>IMT23 Charge : ₹${imt23Charge.toFixed(0)}</p>

<p>TPPD Discount : ₹${tppdDiscount}</p>

<hr style="margin-top:18px; margin-bottom:18px;">

<p>Net Premium : ₹${netPremium.toFixed(0)}</p>

<p>GST 18% : ₹${gst.toFixed(0)}</p>

<div class="price">

₹${finalPremium.toFixed(0)}

</div>

</div>

`;

}

</script>

</body>

</html>
