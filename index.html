<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Policy Perfect Insurance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0b;
color:white;
padding:20px;
}

.title{
font-size:32px;
font-weight:bold;
margin-bottom:25px;
text-align:center;
}

.card{
background:#121212;
border:1px solid #262626;
border-radius:24px;
padding:22px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(255,255,255,0.05);
}

h2{
margin-bottom:18px;
font-size:24px;
}

label{
display:block;
margin-top:16px;
margin-bottom:8px;
color:#cfcfcf;
font-size:14px;
}

input,select{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:14px;
background:#1d1d1d;
color:white;
font-size:16px;
}

.radio-group{
display:flex;
gap:15px;
margin-top:10px;
}

.radio-btn{
flex:1;
padding:14px;
border-radius:14px;
background:#1d1d1d;
text-align:center;
cursor:pointer;
border:1px solid #333;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:white;
color:black;
font-size:18px;
font-weight:bold;
margin-top:25px;
cursor:pointer;
}

.result{
margin-top:25px;
background:#181818;
padding:20px;
border-radius:20px;
border:1px solid #2e2e2e;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:14px;
font-size:16px;
}

.total{
font-size:28px;
font-weight:bold;
margin-top:20px;
text-align:center;
color:#ffffff;
}

.small{
font-size:13px;
color:#999;
margin-top:6px;
}

</style>
</head>

<body>

<div class="title">
Policy Perfect Insurance
</div>

<div class="card">

<h2>Commercial Vehicle Calculator</h2>

<label>Vehicle Type</label>

<select id="vehicleType">
<option value="gcv">Goods Carrying Vehicle (GCV)</option>
<option value="pcv">Passenger Carrying Vehicle (PCV)</option>
<option value="taxi">Taxi</option>
<option value="bus">Bus</option>
</select>

<label>Carrier Type</label>

<select id="carrier">
<option value="public">Public Carrier</option>
<option value="private">Private Carrier</option>
</select>

<label>IDV</label>
<input type="number" id="idv" placeholder="Enter IDV">

<label>GVW (Kg)</label>
<input type="number" id="gvw" placeholder="Enter GVW">

<label>OD Discount (%)</label>
<input type="number" id="discount" placeholder="Enter Discount">

<label>NCB (%)</label>

<select id="ncb">
<option value="0">0%</option>
<option value="20">20%</option>
<option value="25">25%</option>
<option value="35">35%</option>
<option value="45">45%</option>
<option value="50">50%</option>
</select>

<label>IMT 23</label>

<select id="imt23">
<option value="yes">Yes</option>
<option value="no">No</option>
</select>

<label>PA To Owner Driver</label>
<input type="number" id="pa" value="325">

<label>LL To Paid Driver</label>
<input type="number" id="ll" value="50">

<label>Zero Dep Amount</label>
<input type="number" id="zeroDep" value="0">

<button onclick="calculatePremium()">
Calculate Premium
</button>

<div class="result" id="result" style="display:none;">

<h2>Premium Breakup</h2>

<div class="row">
<span>Basic OD</span>
<span id="basicOd"></span>
</div>

<div class="row">
<span>IMT 23</span>
<span id="imtResult"></span>
</div>

<div class="row">
<span>NCB Less</span>
<span id="ncbResult"></span>
</div>

<div class="row">
<span>OD Discount</span>
<span id="discountResult"></span>
</div>

<div class="row">
<span>Final OD</span>
<span id="finalOd"></span>
</div>

<hr style="margin:18px 0;border-color:#333;">

<div class="row">
<span>Third Party</span>
<span id="tpPremium"></span>
</div>

<div class="row">
<span>PA Owner</span>
<span id="paResult"></span>
</div>

<div class="row">
<span>LL Driver</span>
<span id="llResult"></span>
</div>

<div class="row">
<span>Zero Dep</span>
<span id="zeroResult"></span>
</div>

<hr style="margin:18px 0;border-color:#333;">

<div class="row">
<span>GST</span>
<span id="gstResult"></span>
</div>

<div class="total" id="finalPremium"></div>

<div class="small">
GST Calculated As:
18% on OD + 5% on TP
</div>

</div>

</div>

<script>

function calculatePremium(){

let idv = Number(document.getElementById('idv').value);
let gvw = Number(document.getElementById('gvw').value);
let discount = Number(document.getElementById('discount').value);
let ncb = Number(document.getElementById('ncb').value);
let pa = Number(document.getElementById('pa').value);
let ll = Number(document.getElementById('ll').value);
let zeroDep = Number(document.getElementById('zeroDep').value);
let imt23 = document.getElementById('imt23').value;

let odRate = 0.26;

let basicOD = (idv * odRate) / 100;

let imtAmount = 0;

if(imt23 === "yes"){
imtAmount = basicOD * 0.15;
}

let ncbLess = (basicOD * ncb) / 100;

let discountLess = (basicOD * discount) / 100;

let finalOD =
basicOD +
imtAmount -
ncbLess -
discountLess +
zeroDep;

let tp = 16049;

if(gvw > 7500){
tp = 35313;
}

if(gvw > 12000){
tp = 42134;
}

let totalBeforeGST =
finalOD +
tp +
pa +
ll;

let gstOD = finalOD * 0.18;

let gstTP = tp * 0.05;

let totalGST = gstOD + gstTP;

let finalTotal =
totalBeforeGST +
totalGST;

document.getElementById('result').style.display='block';

document.getElementById('basicOd').innerHTML =
"₹" + basicOD.toFixed(0);

document.getElementById('imtResult').innerHTML =
"₹" + imtAmount.toFixed(0);

document.getElementById('ncbResult').innerHTML =
"- ₹" + ncbLess.toFixed(0);

document.getElementById('discountResult').innerHTML =
"- ₹" + discountLess.toFixed(0);

document.getElementById('finalOd').innerHTML =
"₹" + finalOD.toFixed(0);

document.getElementById('tpPremium').innerHTML =
"₹" + tp.toFixed(0);

document.getElementById('paResult').innerHTML =
"₹" + pa.toFixed(0);

document.getElementById('llResult').innerHTML =
"₹" + ll.toFixed(0);

document.getElementById('zeroResult').innerHTML =
"₹" + zeroDep.toFixed(0);

document.getElementById('gstResult').innerHTML =
"₹" + totalGST.toFixed(0);

document.getElementById('finalPremium').innerHTML =
"Total Premium ₹" + finalTotal.toFixed(0);

}

</script>

</body>
</html>
