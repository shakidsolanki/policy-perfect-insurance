<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Policy Perfect Insurance</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

.header{
padding:25px;
text-align:center;
background:linear-gradient(90deg,#0f172a,#1d4ed8);
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#111827;
border:1px solid #1e3a8a;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(37,99,235,0.2);
}

input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:bold;
}

.quote{
background:#0f172a;
padding:18px;
border-radius:16px;
margin-top:15px;
border:1px solid #2563eb;
}

.price{
font-size:32px;
font-weight:bold;
color:#60a5fa;
margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
Policy Perfect Insurance
</div>

<div class="container">

<div class="card">

<h2>Commercial Vehicle Quote</h2>

<input type="number" id="od" placeholder="OD Premium">

<input type="number" id="tp" placeholder="TP Premium">

<input type="number" id="imt23" placeholder="IMT23 Amount">

<input type="number" id="discount" placeholder="Manual Discount %">

<button onclick="generateQuote()">
Generate Quote
</button>

</div>

<div class="card">

<h2>Quote Result</h2>

<div id="result"></div>

</div>

</div>

<script>

function generateQuote(){

let od = parseFloat(document.getElementById("od").value) || 0;

let tp = parseFloat(document.getElementById("tp").value) || 0;

let imt23 = parseFloat(document.getElementById("imt23").value) || 0;

let discount = parseFloat(document.getElementById("discount").value) || 0;

let discountAmount = (od * discount)/100;

let finalOD = od - discountAmount;

let netPremium = finalOD + tp + imt23;

let gst = netPremium * 0.18;

let finalPremium = netPremium + gst;

document.getElementById("result").innerHTML = `

<div class="quote">

<h3>Commercial Vehicle Quote</h3>

<p>OD Premium: ₹${od}</p>

<p>Discount: ₹${discountAmount.toFixed(0)}</p>

<p>Final OD: ₹${finalOD.toFixed(0)}</p>

<p>TP Premium: ₹${tp}</p>

<p>IMT23: ₹${imt23}</p>

<hr>

<p>Net Premium: ₹${netPremium.toFixed(0)}</p>

<p>GST 18%: ₹${gst.toFixed(0)}</p>

<div class="price">

₹${finalPremium.toFixed(0)}

</div>

</div>

`;

}

</script>

</body>

</html>
