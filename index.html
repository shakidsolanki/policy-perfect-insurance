<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Policy Perfect Insurance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
color:#111;
}

.header{
background:#000;
color:white;
padding:22px;
font-size:28px;
font-weight:bold;
text-align:center;
letter-spacing:1px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:22px;
border-radius:22px;
margin-top:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
margin-bottom:18px;
font-size:24px;
}

input,select{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:14px;
background:#f1f1f1;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin-top:20px;
background:#000;
color:white;
border:none;
border-radius:16px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.quote{
background:#000;
color:white;
padding:20px;
border-radius:20px;
margin-top:15px;
}

.quote p{
margin-top:10px;
font-size:16px;
}

.price{
font-size:34px;
font-weight:bold;
margin-top:20px;
}

.label{
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
Policy Perfect Insurance
</div>

<div class="container">

<div class="card">

<h2>Commercial Vehicle Quote</h2>

<select id="vehicleType">

<option value="16500">GCV Pickup</option>

<option value="35000">Truck</option>

<option value="12400">Taxi</option>

<option value="7800">Auto Rickshaw</option>

<option value="22000">School Van</option>

<option value="45000">Bus</option>

</select>

<input type="number" id="od" placeholder="OD Premium">

<input type="number" id="imt23" placeholder="IMT23 Amount">

<input type="number" id="discount" placeholder="Discount %">

<button onclick="generateQuote()">
Generate Quote
</button>

</div>

<div class="card">

<h2>Quote Result</h2>

<div id="result"></div>

</div>

</div>

<script>

function generateQuote(){

let tp = parseFloat(document.getElementById("vehicleType").value);

let od = parseFloat(document.getElementById("od").value) || 0;

let imt23 = parseFloat(document.getElementById("imt23").value) || 0;

let discount = parseFloat(document.getElementById("discount").value) || 0;

let discountAmount = (od * discount)/100;

let finalOD = od - discountAmount;

let netPremium = finalOD + tp + imt23;

let gst = netPremium * 0.18;

let finalPremium = netPremium + gst;

document.getElementById("result").innerHTML = `

<div class="quote">

<p><span class="label">TP Premium:</span> ₹${tp}</p>

<p><span class="label">OD Premium:</span> ₹${od}</p>

<p><span class="label">Discount:</span> ₹${discountAmount.toFixed(0)}</p>

<p><span class="label">Final OD:</span> ₹${finalOD.toFixed(0)}</p>

<p><span class="label">IMT23:</span> ₹${imt23}</p>

<hr style="margin-top:15px; margin-bottom:15px;">

<p><span class="label">Net Premium:</span> ₹${netPremium.toFixed(0)}</p>

<p><span class="label">GST 18%:</span> ₹${gst.toFixed(0)}</p>

<div class="price">

₹${finalPremium.toFixed(0)}

</div>

</div>

`;

}

</script>

</body>

</html>
